name: Docker_CI_setup

on:
  push:
    branches: [ "main" ] # Good practice to specify the branch

jobs:
  docker:
    runs-on: self-hosted
    steps:
      # Step 1: Check out your repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          # IMPORTANT: Change 'your-image-name' to your actual image name
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/your-image-name:latest
